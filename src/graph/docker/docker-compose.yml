services:
  gnn-baselines:
    container_name: gnn-baselines
    build:
      context: ./gnn-baselines/
      dockerfile: Dockerfile
    volumes:
      - ./gnn-baselines/:/gnn-baselines
      - primevul:/gnn-baselines/data/primevul
    depends_on:
      - db
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]

volumes:
  primevul:
    external: true
